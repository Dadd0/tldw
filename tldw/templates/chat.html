{% if mode == "ask" %}
<details id="chat-history" open>
  <summary>chats</summary>
  <button type="button" id="new-chat">new chat</button>
  <ol id="chat-list"></ol>
</details>
{% endif %}
<section id="chat" aria-labelledby="chat-title"{% if mode != 'ask' %} hidden{% endif %}>
  <header class="chat-header">
    <h2 id="chat-title" tabindex="-1">Ask</h2>
    <a href="/ask" id="expand-chat"{% if mode == 'ask' %} hidden{% endif %}>expand</a>
    <a href="/" id="back-to-read"{% if mode != 'ask' %} hidden{% endif %}>back to read</a>
    <button type="button" id="close-chat"{% if mode == 'ask' %} hidden{% endif %}>close</button>
  </header>
  <div class="chat-log" role="log" aria-label="Conversation" tabindex="0">
    <ol id="chat-turns"></ol>
  </div>
  <form id="chat-form">
    <label for="chat-question">Question</label>
    <textarea id="chat-question" rows="2" required></textarea>
    <div class="chat-submit">
      <button type="submit" id="send-question">Send</button>
      <button type="button" id="retry-question" hidden>Retry</button>
      <span id="chat-spinner" aria-hidden="true" hidden></span>
      <span id="chat-status" role="status"></span>
    </div>
  </form>
</section>
